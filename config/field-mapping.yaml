# ###########################################################################
# ##  REPLACE WITH REAL SCHEMA                                             ##
# ###########################################################################
# This is the ONE place the manufacturing event shape is defined. It maps the
# synthetic `mdp.mfg.v1` placeholder envelope/event to the flattened business
# columns. When the real `testMeasurementEvent` is gathered, edit THIS FILE
# (envelope keys, per-column event keys, and required_fields). No Flink/Java
# pipeline code changes — the flattener is driven entirely by this mapping.
#
# TODO: confirm with mentors — real envelope/event field names, the real
# required-field set, and the real topic name.
# ###########################################################################

envelope:
  message_id: messageId         # envelope -> message_id business column
  schema_version: schemaVersion # envelope -> schema_version business column
  events_array: events          # JSON array field holding the per-test events

# business_column: json_field_name_within_each_event
event:
  event_id: eventId
  test_station_id: testStationId
  product_model: productModel
  product_serial: productSerial
  test_program: testProgram
  test_session_id: testSessionId
  operator_id: operatorId
  measurement_name: measurementName
  measurement_value: measurementValue
  measurement_unit: measurementUnit
  lower_limit: lowerLimit
  upper_limit: upperLimit
  result: result
  measured_at: measuredAt

# Required fields for a VALID event (by JSON name). Missing or null -> quarantine.
required_fields:
  - eventId
  - productSerial
  - measurementName
  - measurementValue
  - measuredAt

# Columns parsed as numeric doubles (others are strings; *_at are timestamps).
numeric_fields:
  - measurement_value
  - lower_limit
  - upper_limit
timestamp_fields:
  - measured_at

# ---------------------------------------------------------------------------
# Derived columns: business columns computed by an operation rather than copied
# from a single event field. This section is optional. Each entry names its
# operation with `op`. The four operations below are the shapes the production
# MDP model needs. The example source fields (instrumentId, testSpecAttributes,
# measurementResult, calibratedAt) are not produced by the synthetic generator,
# so on the synthetic path these columns are null and the live flattened table
# is unchanged; they exist here to document the format and are proven by tests.
# ---------------------------------------------------------------------------
derived:
  # 1) FALLBACK CHAIN (coalesce): first source that is present and not null wins.
  - op: fallback
    column: product_identity
    sources: [instrumentId, accessoryId, subAssemblyId]

  # 2) ARRAY REDUCE: pick named entries from an array of {name, value} objects and
  #    collapse their numeric values. Used for the upper (UL, max) and lower
  #    (LL, min) limits, which live inside the test specification attributes array.
  - op: array_reduce
    column: spec_upper_limit
    source_array: testSpecAttributes
    match: UL
    reduce: max
    name_key: name        # optional, defaults to: name
    value_key: value      # optional, defaults to: value
  - op: array_reduce
    column: spec_lower_limit
    source_array: testSpecAttributes
    match: LL
    reduce: min

  # 3) NUMERIC AND STRING SPLIT: one source string yields a numeric column when it
  #    parses as a decimal, otherwise the original text in the string column. A non
  #    numeric value is kept as text, never quarantined.
  - op: numeric_string_split
    source: measurementResult
    numeric_column: measurement_result_numeric
    string_column: measurement_result_text

  # 4) MULTI FORMAT TIMESTAMP: first matching format wins, else null. The token
  #    ISO_8601 matches an ISO 8601 instant or offset; other entries are calendar
  #    date patterns read at midnight UTC.
  - op: multi_format_timestamp
    column: calibrated_at
    source: calibratedAt
    formats: [ISO_8601, "MM/dd/yyyy", "yyyy-MM-dd"]
