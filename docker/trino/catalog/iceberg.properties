# Trino Iceberg connector -> Iceberg REST catalog -> MinIO (S3).
# This is the ONLY file that binds the external query engine to the tables.
# To point real Snowflake/Glue at the same tables, you swap this layer, not the
# Flink processor (see README "How to swap in the real MDP topic and schema").
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# Native S3 filesystem (Trino 481) pointed at MinIO.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
