# Single-node Trino coordinator (also acts as worker). Heap-capped for the
# 8 GB Docker VM — see docker/trino/jvm.config.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=1GB
query.max-memory-per-node=600MB
memory.heap-headroom-per-node=300MB
