# ===========================================================================
# Local SPaaS MDP flattener harness — full stack.
#
# Mirrors production: Kafka -> Flink flattener -> Iceberg-on-S3 (REST catalog)
# -> external SQL engine. Local stand-ins speak the same wire protocols:
#   Kafka (KRaft)            <- same as prod Kafka
#   MinIO                    <- same S3 API as prod AWS S3
#   apache/iceberg-rest      <- same Iceberg REST protocol as prod AWS Glue REST
#   Flink 1.20 (DataStream)  <- same engine/API as the prod flattener
#   Trino                    <- external SQL engine, stand-in for Snowflake
#
# RAM is tight (8 GB Docker VM) so every JVM heap is capped. Python (generator,
# demo API) runs on the HOST, not in a container, to save memory/disk.
# Prometheus + Grafana are in the optional "observability" profile (off by default).
# ===========================================================================

name: spaas-mdp-harness

services:

  # --------------------------------------------------------------------- Kafka
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: spaas-kafka
    ports:
      - "29092:29092"   # EXTERNAL listener for host clients (generator, tests)
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # kafka-topics ships in the image, so this check has no external tool deps.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------------- MinIO
  minio:
    image: ${MINIO_IMAGE}
    container_name: spaas-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${AWS_REGION}
    volumes:
      - minio_data:/data
    # The minio server image is built on ubi-micro and ships no curl/wget, so
    # readiness is gated by the minio-init container below (which runs `mc ready`)
    # and by scripts/wait-for-stack.sh on the host. No in-container healthcheck.

  # Creates the warehouse bucket and gates downstream services until MinIO serves.
  minio-init:
    image: ${MC_IMAGE}
    container_name: spaas-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 1;
      done;
      /usr/bin/mc mb -p local/${WAREHOUSE_BUCKET} || true;
      echo 'minio bucket ready: ${WAREHOUSE_BUCKET}';
      "
    restart: "no"

  # ------------------------------------------------------ Iceberg REST catalog
  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE}
    container_name: spaas-iceberg-rest
    # Image runs as uid 1000 (iceberg) but the named volume mounts root-owned, so
    # the sqlite catalog file can't be created. Run as root so the persisted
    # catalog DB is writable on the volume (local harness only).
    user: root
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      # Persist catalog pointers in a sqlite file on a volume so namespaces/tables
      # survive `make down` (warehouse DATA lives on MinIO; this stores the pointers).
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:file:/var/lib/iceberg-rest/catalog.db
      CATALOG_JDBC_SCHEMA__VERSION: V1
      CATALOG_WAREHOUSE: s3://${WAREHOUSE_BUCKET}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - iceberg_rest_data:/var/lib/iceberg-rest

  # --------------------------------------------------------------------- Trino
  # External SQL engine — stand-in for Snowflake. Reads the SAME Iceberg tables
  # through the SAME REST catalog, so the processor never changes when swapping
  # Trino out for real Snowflake/Glue.
  trino:
    image: ${TRINO_IMAGE}
    container_name: spaas-trino
    depends_on:
      minio-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro

  # ----------------------------------------------------------- Flink JobManager
  flink-jobmanager:
    image: ${FLINK_IMAGE}
    container_name: spaas-flink-jobmanager
    command: jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8081:8081"   # Flink Web UI
    environment:
      # S3 plugin is enabled so checkpoints can target MinIO (used from M4 on).
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-presto-1.20.4.jar
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        rest.flamegraph.enabled: true
        execution.checkpointing.interval: 10 s
        execution.checkpointing.min-pause: 5 s
        execution.checkpointing.timeout: 5 min
        state.backend.type: hashmap
        state.checkpoints.dir: s3p://${WAREHOUSE_BUCKET}/checkpoints
        state.savepoints.dir: s3p://${WAREHOUSE_BUCKET}/savepoints
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ../processor/build/libs:/jobs:ro
      - ../config:/config:ro

  # ---------------------------------------------------------- Flink TaskManager
  flink-taskmanager:
    image: ${FLINK_IMAGE}
    container_name: spaas-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-presto-1.20.4.jar
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ../processor/build/libs:/jobs:ro
      - ../config:/config:ro

  # ----------------------------------------- Observability (optional profile)
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: spaas-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: spaas-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  kafka_data:
  minio_data:
  iceberg_rest_data:
